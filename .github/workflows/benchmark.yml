# Benchmark card: Dart benchmark_test (AOT) vs liblzo2 2.10 (C)
#
# Triggered when the `CI` workflow (see ci.yml) finishes. It only acts when CI
# passed on the repository's default branch, so the numbers always describe a
# commit whose tests are green.
#
#   ubuntu  : distro liblzo2-dev     -> canonical Dart + C JSON (used by render)
#   windows : liblzo2 2.10 built from the official tarball with CMake/MSVC
#                                    -> same two JSON files (artifact only,
#                                       proves the pipeline is portable)
#   render  : renders the ubuntu numbers with unk-404/benchcat@master and
#             commits assets/benchmarks.svg when it changed
#
# The benchcat action installs its own binary and carries its own OFL font
# catalogue. Never add a `gh release download` / `curl` of the benchcat binary,
# `cargo install`, `git clone`, a fonts/ directory, or a `benchcat render` run
# step here.
name: Benchmark

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  LZO_2_10_URL: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz

jobs:
  ubuntu:
    name: ubuntu / Dart AOT + liblzo2 (distro package)
    runs-on: ubuntu-24.04
    # Only benchmark a green CI run of the default branch. This is the
    # "main branch" gate, and it keeps pull-request CI from refreshing the card.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install liblzo2
        run: sudo apt-get update && sudo apt-get install -y liblzo2-dev

      - name: Run the Dart benchmarks (AOT) and canonicalise them
        run: |
          dart pub get
          mkdir -p build/bench
          dart run benchmark_test --compile aot --output jsonl \
            benchmark/dart/lzo1x_benchmark_test.dart > build/bench/dart-aot.jsonl
          dart run benchmark/dart/canonical.dart \
            build/bench/dart-aot.jsonl build/bench/dart-aot.json

      - name: Build and run the liblzo2 benchmark
        run: |
          make -C benchmark/c
          ./benchmark/c/lzo_bench --text README.md --out build/bench/liblzo2-c.json

      - name: Upload the canonical results
        uses: actions/upload-artifact@v4
        with:
          name: bench-canonical-ubuntu
          path: build/bench/*.json
          if-no-files-found: error

  windows:
    name: windows / Dart AOT + liblzo2 2.10 (built from source)
    runs-on: windows-2022
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build liblzo2 2.10 from the official tarball
        run: |
          mkdir -p build/deps
          curl -fsSL -o build/deps/lzo-2.10.tar.gz "$LZO_2_10_URL"
          tar -xzf build/deps/lzo-2.10.tar.gz -C build/deps
          cmake -S build/deps/lzo-2.10 -B build/deps/lzo-build \
            -DENABLE_STATIC=ON -DENABLE_SHARED=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build/deps/lzo-build --config Release --target lzo_static_lib

      - name: Build the benchmark harness
        run: |
          # Git Bash's $PWD is a POSIX path; CMake is a Windows program.
          WIN_ROOT="$(pwd -W)"
          cmake -S benchmark/c -B build/c \
            -DLZO_INCLUDE_DIR="$WIN_ROOT/build/deps/lzo-2.10/include" \
            -DLZO_LIBRARY="$WIN_ROOT/build/deps/lzo-build/Release/lzo2.lib"
          cmake --build build/c --config Release

      - name: Run the Dart benchmarks (AOT) and canonicalise them
        run: |
          dart pub get
          mkdir -p build/bench
          dart run benchmark_test --compile aot --output jsonl \
            benchmark/dart/lzo1x_benchmark_test.dart > build/bench/dart-aot.jsonl
          dart run benchmark/dart/canonical.dart \
            build/bench/dart-aot.jsonl build/bench/dart-aot.json

      - name: Run the liblzo2 benchmark
        run: |
          ./build/c/Release/lzo_bench.exe --text README.md \
            --out build/bench/liblzo2-c.json

      - name: Upload the canonical results
        uses: actions/upload-artifact@v4
        with:
          name: bench-canonical-windows
          path: build/bench/*.json
          if-no-files-found: error

  render:
    name: render the chart
    # The card has exactly two series and both come from the ubuntu job, so a
    # Windows toolchain problem must not block the chart refresh: that job is an
    # independent portability check and still turns the workflow red if it
    # breaks.
    needs: [ubuntu]
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the canonical results (ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: bench-canonical-ubuntu
          path: build/bench

      # The action installs its own benchcat binary and font catalogue; the
      # two series come from benchmark/benchcat.toml.
      - name: Render the chart
        uses: unk-404/benchcat@master
        with:
          config: benchmark/benchcat.toml
          format: json
          out: assets/benchmarks.svg

      - name: Commit the refreshed chart
        run: |
          test -s assets/benchmarks.svg
          head -c 5 assets/benchmarks.svg; echo
          git add assets/benchmarks.svg
          if git diff --cached --quiet -- assets/benchmarks.svg; then
            echo "chart unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(bench): refresh chart [skip ci]"
          # Rebase on the branch tip in case it moved while the benchmarks ran.
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
