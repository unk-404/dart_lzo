name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The benchmark render job commits assets/benchmarks.svg back to master.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LZO_2_10_URL: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz

jobs:
  analyze:
    name: Analyze and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool benchmark example

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test

  web:
    name: Web smoke test (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      # lib/ is web-safe (no dart:io). Some test files are VM-only because they
      # read fixtures with dart:io, so the browser job runs the web-safe
      # round-trip suite explicitly instead of the whole test directory.
      - name: Run web-safe tests in Chrome
        run: dart test -p chrome test/lzo1x_roundtrip_test.dart test/web_all_test.dart

  differential:
    name: Differential vs liblzo2 2.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install Dart dependencies
        run: dart pub get
      - name: Build liblzo2 2.10 from the official tarball
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/lzo-2.10.tar.gz" \
            "$LZO_2_10_URL"
          tar -xzf "$RUNNER_TEMP/lzo-2.10.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/lzo-2.10"
          ./configure --enable-static --disable-shared
          make -j"$(nproc)"
      - name: Build the oracle CLI
        run: |
          make -C tool/oracle \
            LZO_INCLUDE="$RUNNER_TEMP/lzo-2.10/include" \
            LZO_LIBDIR="$RUNNER_TEMP/lzo-2.10/src/.libs"
          tool/oracle/lzo_oracle version
      - name: Run the differential
        run: dart run tool/differential.dart --oracle tool/oracle/lzo_oracle
      - name: Run the full-matrix differential
        run: dart run tool/differential_all.dart --oracle tool/oracle/lzo_oracle
      - name: Verify the committed vectors are reproducible
        run: |
          set -euo pipefail
          LZO_ORACLE="$PWD/tool/oracle/lzo_oracle" \
            bash tool/vectors/generate.sh
          LZO_ORACLE="$PWD/tool/oracle/lzo_oracle" \
            bash tool/vectors/generate_families.sh
          git diff --exit-code -- test/data

  # TEST -> benchmark -> assets/benchmarks.svg, all in this workflow.
  benchmark-ubuntu:
    name: Benchmark (ubuntu, liblzo2 C)
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install liblzo2
        run: sudo apt-get update && sudo apt-get install -y liblzo2-dev
      - name: Run the Dart benchmarks (AOT) and canonicalise them
        run: |
          set -euo pipefail
          dart pub get
          mkdir -p build/bench
          dart run benchmark_test --compile aot --output jsonl \
            benchmark/dart/lzo1x_benchmark_test.dart > build/bench/dart-aot.jsonl
          dart run benchmark/dart/canonical.dart \
            build/bench/dart-aot.jsonl build/bench/dart-aot.json
      - name: Build and run the liblzo2 benchmark
        run: |
          set -euo pipefail
          make -C benchmark/c
          ./benchmark/c/lzo_bench --text README.md --out build/bench/liblzo2-c.json
      - name: Upload the canonical results
        uses: actions/upload-artifact@v4
        with:
          name: bench-canonical-ubuntu
          path: build/bench/*.json
          if-no-files-found: error

  benchmark-windows:
    name: Benchmark (windows, liblzo2 C)
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build liblzo2 2.10 from the official tarball
        run: |
          set -euo pipefail
          mkdir -p build/deps
          curl -fsSL -o build/deps/lzo-2.10.tar.gz "$LZO_2_10_URL"
          tar -xzf build/deps/lzo-2.10.tar.gz -C build/deps
          cmake -S build/deps/lzo-2.10 -B build/deps/lzo-build \
            -DENABLE_STATIC=ON -DENABLE_SHARED=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build/deps/lzo-build --config Release --target lzo_static_lib
      - name: Build the benchmark harness
        run: |
          set -euo pipefail
          cmake -S benchmark/c -B build/c \
            -DLZO_INCLUDE_DIR="$(pwd -W)/build/deps/lzo-2.10/include" \
            -DLZO_LIBRARY="$(pwd -W)/build/deps/lzo-build/Release/lzo2.lib"
          cmake --build build/c --config Release
      - name: Run the Dart benchmarks (AOT) and canonicalise them
        run: |
          set -euo pipefail
          dart pub get
          mkdir -p build/bench
          dart run benchmark_test --compile aot --output jsonl \
            benchmark/dart/lzo1x_benchmark_test.dart > build/bench/dart-aot.jsonl
          dart run benchmark/dart/canonical.dart \
            build/bench/dart-aot.jsonl build/bench/dart-aot.json
      - name: Run the liblzo2 benchmark
        run: |
          set -euo pipefail
          ./build/c/Release/lzo_bench.exe --text README.md \
            --out build/bench/liblzo2-c.json
      - name: Upload the canonical results
        uses: actions/upload-artifact@v4
        with:
          name: bench-canonical-windows
          path: build/bench/*.json
          if-no-files-found: error

  render:
    name: Render benchmark card
    # The chart data comes from the ubuntu job. The windows job is an
    # independent portability check: if it breaks, the run is red but the chart
    # still lands in assets/.
    needs: [benchmark-ubuntu]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the canonical results (ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: bench-canonical-ubuntu
          path: build/bench
      # The action installs its own benchcat binary and font catalogue; the
      # two series come from benchmark/benchcat.toml.
      - name: Render the chart
        uses: unk-404/benchcat@master
        with:
          config: benchmark/benchcat.toml
          format: json
          out: assets/benchmarks.svg
      - name: Commit the refreshed chart
        run: |
          set -euo pipefail
          test -s assets/benchmarks.svg
          head -c 5 assets/benchmarks.svg; echo
          git add assets/benchmarks.svg
          if git diff --cached --quiet -- assets/benchmarks.svg; then
            echo "chart unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(bench): refresh chart [skip ci]"
          git push origin HEAD:master
