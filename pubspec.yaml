name: lzo_neo
description: >-
  Pure Dart implementation of the LZO1X lossless compression algorithm, with
  liblzo2-compatible streams and zero native dependencies.
version: 0.2.0
repository: https://github.com/unk-404/dart_lzo
issue_tracker: https://github.com/unk-404/dart_lzo/issues
topics:
  - compression
  - lzo
  - codec

environment:
  sdk: ^3.13.5

dependencies:
  blit: ^0.1.4

dev_dependencies:
  benchmark_test: ^0.1.2
  lints: ^6.0.0
  test: ^1.25.6
